# Auto-release: every push to master builds. If the current version is already
# released, the version is bumped automatically (patch by default; put the word
# #minor or #major in the PR title / merge commit for a bigger bump), the bump is committed
# back to master, and a GitHub release with generated notes is published.
# Pushes that only touch docs, markdown or CI files build but do not release.
# A version you bump by hand in a PR is used as-is.
name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump level (patch, minor, major); empty = auto"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide version (auto-bump when the current version is already released)
        id: ver
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUMP_INPUT: ${{ github.event.inputs.bump }}
          BRANCH: master
        run: |
          set -euo pipefail
          read_version() { jq -r .version package.json; }
          write_version() { npm version "$1" --no-git-tag-version >/dev/null; }
          cur=$(read_version)
          [ -n "$cur" ] || { echo "could not read the current version" >&2; exit 1; }
          tag="v$cur"; sha=$(git rev-parse HEAD); release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            relevant=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in docs/*|*.md|.github/*|.gitignore|LICENSE) ;; *) relevant=true; echo "releasable change: $f";; esac
            done < <(git diff --name-only "$tag" HEAD)
            if [ "$relevant" = false ]; then
              echo "No releasable changes since $tag (docs/CI only) - build only, no release."
              release=false
            else
              level=patch
              case "${BUMP_INPUT:-}" in major|minor|patch) level=$BUMP_INPUT;; esac
              # "#major" / "#minor" must be a standalone token in the merge commit / PR title
              kw() { grep -Eq "(^|[[:space:](\[])#$1([[:space:])\].,:;!]|$)" <<< "${COMMIT_MSG:-}"; }
              if kw major; then level=major; elif kw minor; then level=minor; fi
              IFS=. read -r a b c <<< "$cur"
              case $level in
                major) a=$((a+1)); b=0; c=0;;
                minor) b=$((b+1)); c=0;;
                patch) c=$(( ${c:-0} + 1 ));;
              esac
              new="$a.$b.$c"
              write_version "$new"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- package.json package-lock.json
              git commit -m "chore: bump version to v$new [skip ci]"
              git push origin "HEAD:$BRANCH"
              tag="v$new"; sha=$(git rev-parse HEAD)
              echo "Bumped $cur -> $new ($level)"
            fi
          else
            echo "Version $cur was set by hand and is not released yet - releasing as-is."
          fi
          { echo "tag=$tag"; echo "sha=$sha"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build PalworldBridge.exe
        run: npm run build:exe

      - name: Package release assets
        run: |
          mkdir -p release
          cp build/PalworldBridge.exe TakaroConfig.txt release/
          zip -qr release/TakaroChat.zip TakaroChat
          git archive --format=tar.gz --prefix="Palworld-Bridge-${{ steps.ver.outputs.tag }}/" \
            -o "release/Palworld-Bridge-${{ steps.ver.outputs.tag }}-source.tar.gz" HEAD
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Create release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build.outputs.sha }}" \
            --title "${{ needs.build.outputs.tag }}" \
            --generate-notes \
            release/*
